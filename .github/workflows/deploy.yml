name: Deploy to Helios

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy via rsync with sshpass
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: ./dist/
          remote_path: /home/studs/${{ secrets.HELIOS_USER }}/public_html/
          remote_host: ${{ secrets.HELIOS_HOST }}
          remote_port: ${{ secrets.HELIOS_PORT }}
          remote_user: ${{ secrets.HELIOS_USER }}
          remote_key: ${{ secrets.HELIOS_PASSWORD }}