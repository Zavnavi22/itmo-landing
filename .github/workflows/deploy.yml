name: Deploy to Helios

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy via rsync with sshpass
        env:
          HELIOS_USER: ${{ secrets.HELIOS_USER }}
          HELIOS_HOST: ${{ secrets.HELIOS_HOST }}
          HELIOS_PORT: ${{ secrets.HELIOS_PORT }}
          HELIOS_PASSWORD: ${{ secrets.HELIOS_PASSWORD }}
        run: |
          sshpass -p "$HELIOS_PASSWORD" rsync -avz --delete \
            -e "ssh -p $HELIOS_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./dist/ \
            "$HELIOS_USER@$HELIOS_HOST:~/public_html/"